# PR Title Check Workflow
#
# Validates PR titles against Anomalib's Conventional Commit format (with
# optional leading emojis) using `.github/scripts/check_pr_title.py`.

name: Reusable PR Title Check

on:
  workflow_call:
    inputs:
      python-version:
        description: "Kept for caller compatibility; uses runner python3"
        type: string
        default: "3.10"

permissions: {} # No permissions by default on workflow level

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Required to checkout the validation script
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout PR title validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/check_pr_title.py

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/check_pr_title.py
