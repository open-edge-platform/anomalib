# Production publication is authorized only by owner publishing an existing draft.
name: Release Library

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to validate (e.g., lib/v2.7.1)"
        required: true
        type: string
      dry_run:
        description: "Validation only; production requires owner publication of draft"
        required: true
        type: boolean
        default: true

permissions: {}

jobs:
  version-check:
    if: >-
      (github.event_name == 'release' &&
       startsWith(github.event.release.tag_name, 'lib/v') &&
       github.event.release.author.id == 17232914 &&
       github.actor == 'ashwinvaidya17' &&
       !github.event.release.draft && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate-version.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || github.ref }}
          sparse-checkout: src/anomalib/__init__.py
      - name: Validate version
        id: validate-version
        env:
          INPUTS_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          VERSION="${INPUTS_VERSION#lib/}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $INPUTS_VERSION"
            exit 1
          fi
          TAG_VERSION="${VERSION#v}"
          PKG_VERSION=$(sed -n "s/^[[:space:]]*__version__[[:space:]]*=[[:space:]]*[\"']\([^\"']*\)[\"']/\1/p" src/anomalib/__init__.py)
          if [[ "$PKG_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package ($PKG_VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  quality:
    needs: [version-check]
    uses: ./.github/workflows/_reusable-code-quality.yaml
    permissions:
      contents: read
    with:
      python-version: "3.10"

  unit-tests:
    needs: [version-check]
    uses: ./.github/workflows/_reusable-test-suite.yaml
    permissions:
      contents: read
    with:
      python-version: "3.10"
      test-type: "unit"
      runner: "ubuntu-latest"
      timeout: 30
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}

  integration-tests:
    needs: [version-check]
    uses: ./.github/workflows/_reusable-test-suite.yaml
    permissions:
      contents: read
    with:
      python-version: "3.10"
      test-type: "integration"
      runner: "self-hosted"
      timeout: 60
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}

  security:
    needs: [version-check]
    uses: ./.github/workflows/_reusable-security-scan.yaml
    permissions:
      security-events: write
      packages: read
      contents: read
    with:
      tools: "bandit,semgrep,trivy,zizmor"
      scan-scope: "all"
      severity-level: "HIGH"
      fail-on-findings: false

  build:
    needs: [version-check, quality, unit-tests, integration-tests, security]
    if: github.event_name == 'release'
    uses: ./.github/workflows/_reusable-artifact-builder.yaml
    permissions:
      contents: read
    with:
      python-version: "3.10"
      verify-package: true

  publish:
    needs: [version-check, build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
      - name: Attach artifacts to existing owner-published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*

  status:
    needs: [version-check, publish]
    if: always() && github.event_name == 'release' && startsWith(github.event.release.tag_name, 'lib/v')
    runs-on: ubuntu-latest
    steps:
      - name: Verify workflow status
        env:
          PUBLISH_STATUS: ${{ needs.publish.result }}
        run: |
          if [[ "$PUBLISH_STATUS" != "success" ]]; then
            echo "::error::Release workflow failed with status: $PUBLISH_STATUS"
            exit 1
          fi
