# Code Quality Workflow
#
# This reusable workflow executes code quality checks using prek (prek workspace tool)
# with support for monorepo configurations and multiple prek configs.
#
# Key Features:
# - Workspace mode support (multiple .pre-commit-config.yaml files)
# - Multi-language support (Python, Node.js, etc.)
# - Automatic environment management
# - Dependency caching
# - Parallel check execution
#
# Process Stages:
# 1. Checkout:
#    - Full repository history
#    - LFS file support
#
# 2. Quality Checks (via prek):
#    - Code linting
#    - Style verification
#    - Type checking
#    - Best practices validation
#    - Runs appropriate hooks based on file location
#
# 3. Results Processing:
#    - Error reporting
#    - Check summaries
#    - Status updates
#
# Required Inputs:
# - python-version: Python version for checks (default: "3.11")
#
# Example Usage:
# 1. Default Configuration:
#    jobs:
#      quality:
#        uses: ./.github/workflows/_reusable-code-quality.yaml
#
# 2. Custom Versions:
#    jobs:
#      quality:
#        uses: ./.github/workflows/_reusable-code-quality.yaml
#        with:
#          python-version: "3.11"
#
# Note: Uses prek-action (https://github.com/j178/prek-action) which supports
# multiple pre-commit configs in workspace mode for monorepo setups

name: Reusable Code Quality

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version for checks"
        type: string
        default: "3.11"

permissions: {} # No permissions by default on workflow level

jobs:
  prek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Required to checkout the repository
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
